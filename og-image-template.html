<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TierOne Pro - OG Image Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f0f0;
      padding: 20px;
    }

    .og-container {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #0a0a0a 0%, #1f1f1f 100%);
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    /* Geometric accent */
    .accent-line {
      position: absolute;
      top: 0;
      right: 0;
      width: 400px;
      height: 630px;
      background: linear-gradient(90deg, transparent 0%, #CCFF00 100%);
      opacity: 0.1;
      transform: skewX(-15deg) translateX(100px);
    }

    .content {
      position: relative;
      z-index: 2;
      padding: 80px 100px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Oswald', sans-serif;
      font-size: 48px;
      font-weight: 700;
      color: #CCFF00;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .tagline {
      margin-top: 40px;
    }

    .tagline h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 72px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
      margin-bottom: 30px;
      text-transform: uppercase;
    }

    .tagline p {
      font-family: 'Inter', sans-serif;
      font-size: 28px;
      font-weight: 400;
      color: rgba(255,255,255,0.8);
      line-height: 1.4;
      max-width: 700px;
    }

    .highlights {
      display: flex;
      gap: 50px;
      margin-top: 50px;
    }

    .highlight-item {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .highlight-icon {
      width: 50px;
      height: 50px;
      background: #CCFF00;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: #0a0a0a;
      font-family: 'Oswald', sans-serif;
    }

    .highlight-text {
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .url {
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      font-weight: 600;
      color: #CCFF00;
    }

    /* Dots pattern overlay */
    .dots-pattern {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle, rgba(204,255,0,0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="og-container">
    <div class="dots-pattern"></div>
    <div class="accent-line"></div>

    <div class="content">
      <div>
        <div class="logo">TIERONE PRO</div>

        <div class="tagline">
          <h1>ELITE<br>PERFORMANCE<br>SYSTEM</h1>
          <p>Zbuduj ciało atlety • Wytrenuj umysł wojownika • Odzyskaj czas dzięki AI</p>
        </div>

        <div class="highlights">
          <div class="highlight-item">
            <div class="highlight-icon">💪</div>
            <div class="highlight-text">Hybrid Training</div>
          </div>
          <div class="highlight-item">
            <div class="highlight-icon">🧠</div>
            <div class="highlight-text">Mental Edge</div>
          </div>
          <div class="highlight-item">
            <div class="highlight-icon">⚡</div>
            <div class="highlight-text">AI Automation</div>
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="url">tierone-pro.pl</div>
      </div>
    </div>
  </div>
</body>
</html>
